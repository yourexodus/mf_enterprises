    /* Base typography and independent scrollable workspace layout */
    :root {

      --s900: #78350f;

      box-sizing: border-box;
    }

      color: #0f172a;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Dynamic 5-step business preset theme utility classes */
    .bg-s100 { background-color: var(--s100); }
    .bg-s300 { background-color: var(--s300); }
    .bg-s500 { background-color: var(--s500); }
    .bg-s700 { background-color: var(--s700); }
    .bg-s900 { background-color: var(--s900); }

    .text-s500 { color: var(--s500); }
    .text-s700 { color: var(--s700); }
    .text-s900 { color: var(--s900); }

    .border-s300 { border-color: var(--s300); }
    .border-s500 { border-color: var(--s500); }

    .hover-bg-s700:hover { background-color: var(--s700); }
    .hover-border-s500:hover { border-color: var(--s500); }

    /* MF Customer Relations Matrix & Workspace styling */
    .matrix-scroll-container {
      scrollbar-width: thin;
      scrollbar-color: #94a3b8 #e2e8f0;
    }
    .matrix-cell-available {
      background-color: #e3ece6;
      color: #2f4838;
      border: 1px solid #d1dfd6;
    }
    .matrix-cell-available:hover {
      background-color: #cfe0d5;
      border-color: #15803d;
    }
    .matrix-cell-selected {
      background-color: #15803d !important;
      color: #ffffff !important;
      border: 1px solid #14532d !important;
      font-weight: 800;
    }
    .matrix-cell-booked {
      background-color: #f6e2c4;
      color: #b45309;
      border: 1px solid #ebd0a6;
      font-weight: 700;
    }
    .matrix-cell-booked:hover {
      background-color: #efd4ad;
      border-color: #d97706;
    }

    /* 4-Month Macro Weekday Calendar Tile Styling */
    .macro-day-tile {
      transition: all 0.15s ease;
    }
    .macro-day-available {
      background-color: #ffffff;
      border-color: #cbd5e1;
      color: #0f172a;
    }
    .macro-day-available:hover {
      border-color: #15803d;
      background-color: #f8fafc;
      transform: translateY(-1px);
    }
    .macro-day-booked {
      background-color: #fffbeb;
      border-color: #fcd34d;
      color: #0f172a;
    }
    .macro-day-booked:hover {
      border-color: #d97706;
      background-color: #fef3c7;
      transform: translateY(-1px);
    }
    .macro-day-past {
      background-color: #f1f5f9;
      border-color: #e2e8f0;
      color: #94a3b8;
    }
    .macro-day-past:hover {
      background-color: #e2e8f0;
    }
    .macro-day-selected {
      background-color: #f59e0b !important;
      border-color: #b45309 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 10px -2px rgba(217, 119, 6, 0.35);
      transform: translateY(-1px);
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #printable-report-area, #printable-report-area * {
        visibility: visible;
      }
      #printable-report-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    function formatIsoDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseIsoDate(isoStr) {
      const parts = (isoStr || '').split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return new Date(2026, 10, 30);
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function addDaysIso(isoStr, deltaDays) {
      const dt = parseIsoDate(isoStr);
      dt.setDate(dt.getDate() + deltaDays);
      return formatIsoDate(dt);
    }

    function formatMatrixDate(isoStr) {
      const dt = parseIsoDate(isoStr);
      return `${dt.getMonth() + 1}/${dt.getDate()}/${dt.getFullYear()}`;
    }

    function formatReadableDate(isoStr) {
      const dt = parseIsoDate(isoStr);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

    function mfReadClientRequests() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_CRM);
        if (!raw) {
          const seeded = getSeedCrmRecords();
          localStorage.setItem(STORAGE_KEY_CRM, JSON.stringify(seeded));
          return seeded;
        }
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : getSeedCrmRecords();
      } catch (e) {
        return getSeedCrmRecords();
      }
    }

    function mfWriteClientRequests(records) {
      try {
        localStorage.setItem(STORAGE_KEY_CRM, JSON.stringify(records));
      } catch (e) {
        // Safe fallback if storage is restricted
      }
    }

      for (let h = 5; h <= 18; h++) {
        for (let m = 0; m < 60; m += 15) {
          if (h === 18 && m > 0) break;
          const period = h >= 12 ? 'PM' : 'AM';
          const hour12 = h % 12 === 0 ? 12 : h % 12;
          const minStr = String(m).padStart(2, '0');
          slots.push(`${hour12}:${minStr} ${period}`);
        }
      }
      return slots;
    })();

    function setActiveTab(tabName) {
      if (!['storefront', 'contact', 'crm'].includes(tabName)) return;

      updateNavTabStyles();
      renderCurrentTab();

    function updateNavTabStyles() {
      document.querySelectorAll('.nav-tab').forEach(btn => {
        const isActive = btn.dataset.tab === state.activeTab;
        if (isActive) {
          btn.classList.add('bg-s500', 'text-white', 'shadow-xs');
          btn.classList.remove('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
        } else {
          btn.classList.remove('bg-s500', 'text-white', 'shadow-xs');
          btn.classList.add('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
        }
      });
    }

    function syncCrmBadgeCount() {
      const badge = document.getElementById('crm-nav-badge');
      if (!badge) return;
      const newCount = mfReadClientRequests().filter(
        r => r.presetKey === state.presetKey && (r.status || 'New') === 'New'
      ).length;
      badge.textContent = newCount;
      badge.classList.toggle('hidden', newCount === 0);
    }

    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('studio-toast');
      const text = document.getElementById('studio-toast-text');
      if (!toast || !text) return;
      text.textContent = message;
      toast.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 3600);
    }

    function openCrmRecordFromHandoff(recordId) {
      const rec = mfReadClientRequests().find(r => r.id === recordId);

        state.crmForm.editingRecordId = rec.id;
        state.crmForm.date = rec.date;
        state.crmForm.time = rec.time;
        state.crmForm.selectedCustomerId = rec.customerId || '';
        state.crmForm.contactType = rec.topic || 'Consultation';
        state.crmForm.status = rec.status || 'New';
        state.crmForm.notes = rec.message || '';
        state.crmForm.followUpDate = rec.followUpDate || '';
        renderCurrentTab();
      }

    function addProductToCart(productId) {
      const preset = BUSINESS_PRESETS[state.presetKey];
      const product = preset.products.find(p => p.id === productId);
      if (!product) return;

      const existing = state.cart.find(item => item.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        state.cart.push({ ...product, qty: 1 });
      }
      renderCurrentTab();
      showToast(`Added ${product.name} to order inquiry.`);
    }

    function updateCartItemQty(productId, delta) {
      const idx = state.cart.findIndex(item => item.id === productId);
      if (idx === -1) return;
      state.cart[idx].qty += delta;
      if (state.cart[idx].qty <= 0) {
        state.cart.splice(idx, 1);
      }
      renderCurrentTab();
    }

      const contactSection = document.getElementById('storefront-contact-us');
      if (contactSection) contactSection.scrollIntoView({ behavior: 'smooth' });
      showToast('Order items prefilled into the scheduling form below.');
    }

    function mfMoveStorefrontMonth(delta) {
      mfStorefrontCalendarDate = new Date(
        mfStorefrontCalendarDate.getFullYear(),
        mfStorefrontCalendarDate.getMonth() + delta,
        1
      );
      mfRenderStorefrontCalendar();
    }

    function mfRenderStorefrontCalendar() {
      const monthLabel = document.getElementById('mf-storefront-month');
      const grid = document.getElementById('mf-storefront-days');
      if (!monthLabel || !grid) return;

      const year = mfStorefrontCalendarDate.getFullYear();
      const month = mfStorefrontCalendarDate.getMonth();
      monthLabel.textContent = mfStorefrontCalendarDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const minBookableIso = '2026-11-30';
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let firstWeekdayCol = null;
      for (let d = 1; d <= daysInMonth; d++) {
        const dow = new Date(year, month, d).getDay();
        if (dow >= 1 && dow <= 5) {
          firstWeekdayCol = dow - 1;
          break;
        }
      }

      const cells = [];
      if (firstWeekdayCol !== null) {
        for (let i = 0; i < firstWeekdayCol; i++) {
          cells.push('<div class="h-11"></div>');
        }
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dt = new Date(year, month, d);
        const dow = dt.getDay();
        if (dow === 0 || dow === 6) continue;

        const iso = formatIsoDate(dt);
        const isAvailable = iso >= minBookableIso;
        const isSelected = mfStorefrontSelectedDate === iso;

        if (!isAvailable) {
          cells.push(`
            <button type="button" disabled class="h-11 rounded-xl bg-slate-100 border border-slate-200 text-xs font-bold text-slate-400 cursor-not-allowed">
              ${d}
            </button>
          `);
        } else {
          cells.push(`
            <button
              type="button"
              onclick="mfSelectStorefrontDate('${iso}')"
              class="h-11 rounded-xl border text-xs font-extrabold transition ${
                isSelected
                  ? 'bg-amber-500 border-amber-600 text-white shadow-xs'
                  : 'bg-white border-slate-300 text-slate-900 hover:border-amber-500 hover:bg-amber-50'
              }"
            >
              ${d}
            </button>
          `);
        }
      }

      grid.innerHTML = cells.join('');
    }

    function mfSelectStorefrontDate(isoDate) {
      mfStorefrontSelectedDate = isoDate;
      const label = document.getElementById('mf-storefront-selected-date');
      if (label) {
        label.textContent = `Selected date: ${formatReadableDate(isoDate)}`;
      }
      mfRenderStorefrontCalendar();
      mfSetStorefrontTimes();
    }

    function mfSetStorefrontTimes() {
      const timeSelect = document.getElementById('mf-contact-time');
      const submitBtn = document.getElementById('mf-contact-submit');
      if (!timeSelect || !submitBtn) return;

      if (!mfStorefrontSelectedDate) {
        timeSelect.disabled = true;
        timeSelect.classList.add('bg-slate-100');
        timeSelect.innerHTML = '<option value="">Select a date first</option>';
        submitBtn.disabled = true;
        return;
      }

      const bookedTimes = new Set(
        mfReadClientRequests()
          .filter(r => r.presetKey === state.presetKey && r.date === mfStorefrontSelectedDate && r.status !== 'Cancelled')
          .map(r => r.time)
      );

      const openSlots = BOOKING_TIME_SLOTS.filter(slot => !bookedTimes.has(slot));
      timeSelect.disabled = false;
      timeSelect.classList.remove('bg-slate-100');
      timeSelect.innerHTML =
        '<option value="">Choose an available time</option>' +
        openSlots.map(slot => `<option value="${slot}">${slot}</option>`).join('');
      submitBtn.disabled = false;
    }

    function mfSubmitStorefrontRequest(event) {
      event.preventDefault();
      const name = (document.getElementById('mf-contact-name')?.value || '').trim();
      const email = (document.getElementById('mf-contact-email')?.value || '').trim();
      const topic = document.getElementById('mf-contact-topic')?.value || '';
      const time = document.getElementById('mf-contact-time')?.value || '';
      const message = (document.getElementById('mf-contact-message')?.value || '').trim();
      const errBox = document.getElementById('mf-contact-error');

      const emailRegex = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
      if (!name || !emailRegex.test(email) || !topic || !mfStorefrontSelectedDate || !time) {
        if (errBox) {
          errBox.textContent = 'Please complete your name, valid email address, session topic, weekday, and time slot.';
          errBox.classList.remove('hidden');
        }
        return;
      }
      if (errBox) errBox.classList.add('hidden');

      const customers = mfReadCustomers();
      let matchedCust = customers.find(
        c => c.presetKey === state.presetKey && c.email.toLowerCase() === email.toLowerCase()
      );
      if (!matchedCust) {
        matchedCust = {
          id: 'CUST-' + Math.floor(1000 + Math.random() * 9000),
          presetKey: state.presetKey,
          name,
          company: 'New Storefront Inquiry',
          email,
          phone: 'Not provided',
          customerSince: formatIsoDate(new Date()),
          totalOrders: 0,
          lifetimeValue: 0,
          lifecycleStage: 'New Lead'
        };
        customers.unshift(matchedCust);
        mfWriteCustomers(customers);
      }

      const record = {
        id: 'CRM-' + Math.floor(1000 + Math.random() * 9000),
        customerId: matchedCust.id,
        business: BUSINESS_PRESETS[state.presetKey].name,
        presetKey: state.presetKey,
        name,
        email,
        date: mfStorefrontSelectedDate,
        time,
        dateTime: `${mfStorefrontSelectedDate} ${time}`,
        topic,
        message,
        followUpDate: '',
        status: 'New',
        source: 'In-Frame Contact Us',
        submittedAt: new Date().toISOString(),
        lastReply: ''
      };

      const items = mfReadClientRequests();
      items.unshift(record);
      mfWriteClientRequests(items);
      syncCrmBadgeCount();

      const feedback = document.getElementById('mf-contact-feedback');
      if (feedback) {
        feedback.classList.remove('hidden');
        feedback.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span><strong>✓ Appointment Logged:</strong> Added to ${record.business} CRM (${formatReadableDate(record.date)} at ${record.time}).</span>
            <button type="button" onclick="openCrmRecordFromHandoff('${record.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-[11px] shrink-0 transition">
              View in CRM →
            </button>
          </div>
        `;
      }

      event.target.reset();
      mfStorefrontSelectedDate = '';
      const label = document.getElementById('mf-storefront-selected-date');
      if (label) label.textContent = 'Select an available weekday on the calendar.';
      mfRenderStorefrontCalendar();
      mfSetStorefrontTimes();
      showToast(`Appointment ${record.id} synced to CRM.`);
    }

    /**
     * =========================================================================
     * 7. TAB 3: MF CUSTOMER RELATIONS WORKSPACE (2-TIER 4-MONTH + 15-MIN MATRIX)
     * =========================================================================
     */
    function setCrmViewMode(mode) {
      state.crmViewMode = mode;
      if (mode === 'matrix' && state.crmSelectedDayIso) {
        state.crmMatrixStartDate = addDaysIso(state.crmSelectedDayIso, -1);
      }
      renderCurrentTab();
    }

    function moveCrmFourMonths(deltaMonths) {
      const dt = new Date(state.crmQuarterStartYear, state.crmQuarterStartMonth + deltaMonths, 1);
      state.crmQuarterStartYear = dt.getFullYear();
      state.crmQuarterStartMonth = dt.getMonth();
      renderCurrentTab();
    }

    function resetCrmQuarterToDefault() {
      state.crmQuarterStartYear = 2026;
      state.crmQuarterStartMonth = 10; // Nov 2026 – Feb 2027
      state.crmSelectedDayIso = '2026-11-30';
      state.crmForm.date = '2026-11-30';
      renderCurrentTab();
    }

    function selectCrmMacroDay(isoDate) {
      state.crmSelectedDayIso = isoDate;
      state.crmForm.editingRecordId = null;
      state.crmForm.date = isoDate;
      renderCurrentTab();
    }

    function drillDownToDayMatrix(isoDate) {
      state.crmSelectedDayIso = isoDate;
      state.crmForm.date = isoDate;
      state.crmMatrixStartDate = addDaysIso(isoDate, -1);
      state.crmViewMode = 'matrix';
      renderCurrentTab();
    }

    function shiftCrmMatrixDates(deltaDays) {
      state.crmMatrixStartDate = addDaysIso(state.crmMatrixStartDate, deltaDays);
      renderCurrentTab();
    }

    function resetCrmMatrixToToday() {
      state.crmMatrixStartDate = '2026-11-26';
      renderCurrentTab();
    }

    function selectMatrixAvailableSlot(dateIso, timeSlot) {
      state.crmSelectedDayIso = dateIso;
      state.crmForm.editingRecordId = null;
      state.crmForm.date = dateIso;
      state.crmForm.time = timeSlot;
      renderCurrentTab();
    }

    function selectMatrixBookedSlot(recordId) {
      const records = mfReadClientRequests();
      const rec = records.find(r => r.id === recordId);
      if (!rec) return;

      const customers = mfReadCustomers();
      const matchedCustomer = customers.find(
        c => c.id === rec.customerId || (c.presetKey === state.presetKey && c.email.toLowerCase() === (rec.email || '').toLowerCase())
      );

      state.crmSelectedDayIso = rec.date;
      state.crmForm.editingRecordId = rec.id;
      state.crmForm.date = rec.date;
      state.crmForm.time = rec.time;
      state.crmForm.selectedCustomerId = matchedCustomer ? matchedCustomer.id : '';
      state.crmForm.contactType = rec.topic || 'Consultation';
      state.crmForm.status = rec.status || 'Scheduled';
      state.crmForm.notes = rec.message || '';
      state.crmForm.followUpDate = rec.followUpDate || '';
      renderCurrentTab();
    }

    function buildSingleMonthMacroCard(year, monthIndex, brandRecords) {
      const monthDate = new Date(year, monthIndex, 1);
      const monthTitle = monthDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const referenceTodayIso = '2026-11-27';

      let firstWeekdayCol = null;
      for (let d = 1; d <= daysInMonth; d++) {
        const dow = new Date(year, monthIndex, d).getDay();
        if (dow >= 1 && dow <= 5) {
          firstWeekdayCol = dow - 1;
          break;
        }
      }

      const cells = [];
      if (firstWeekdayCol !== null) {
        for (let i = 0; i < firstWeekdayCol; i++) {
          cells.push('<div class="h-16"></div>');
        }
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dt = new Date(year, monthIndex, d);
        const dow = dt.getDay();
        if (dow === 0 || dow === 6) continue;

        const iso = formatIsoDate(dt);
        const dayBookings = brandRecords.filter(r => r.date === iso && r.status !== 'Cancelled');
        const isSelected = state.crmSelectedDayIso === iso;
        const isPast = iso < referenceTodayIso;

        let tileClass = 'macro-day-available';
        if (isSelected) {
          tileClass = 'macro-day-selected';
        } else if (dayBookings.length > 0) {
          tileClass = 'macro-day-booked';
        } else if (isPast) {
          tileClass = 'macro-day-past';
        }

        const firstSlot = dayBookings[0];
        const extraCount = dayBookings.length > 1 ? `+${dayBookings.length - 1} more` : '';

        cells.push(`
          <button
            type="button"
            onclick="selectCrmMacroDay('${iso}')"
            ondblclick="drillDownToDayMatrix('${iso}')"
            title="${dayBookings.length ? `${dayBookings.length} booked — click to select, double-click for 15-min slots` : 'Click to select, double-click for 15-min slots'}"
            class="macro-day-tile ${tileClass} h-16 rounded-xl border px-1.5 py-1.5 flex flex-col items-center justify-between text-center cursor-pointer overflow-hidden"
          >
            <span class="text-xs font-extrabold leading-none ${isSelected ? 'text-white' : ''}">${d}</span>
            ${firstSlot ? `
              <span class="w-full truncate px-1 py-0.5 rounded text-[9px] font-extrabold leading-tight ${
                isSelected ? 'bg-amber-800/60 text-white' : 'bg-[#f6e2c4] text-[#92400e]'
              }">
                ${firstSlot.time}
              </span>
            ` : `
              <span class="text-[9px] leading-none opacity-0">.</span>
            `}
            ${extraCount ? `
              <span class="text-[8px] font-bold leading-none ${isSelected ? 'text-amber-100' : 'text-amber-800'}">
                ${extraCount}
              </span>
            ` : ''}
          </button>
        `);
      }

      return `
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-2xs flex flex-col">
          <div class="flex items-center justify-between mb-3">
            <h4 class="text-sm font-black text-slate-900 tracking-tight">${monthTitle}</h4>
            <span class="text-[10px] font-bold text-slate-400 uppercase">Mon–Fri</span>
          </div>

          <div class="grid grid-cols-5 gap-1.5 text-center text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">
            <div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div>
          </div>

          <div class="grid grid-cols-5 gap-1.5 flex-1">
            ${cells.join('')}
          </div>
        </div>
      `;
    }

    function renderFourMonthMacroCalendar(brandRecords) {
      const m0 = new Date(state.crmQuarterStartYear, state.crmQuarterStartMonth, 1);
      const m1 = new Date(state.crmQuarterStartYear, state.crmQuarterStartMonth + 1, 1);
      const m2 = new Date(state.crmQuarterStartYear, state.crmQuarterStartMonth + 2, 1);
      const m3 = new Date(state.crmQuarterStartYear, state.crmQuarterStartMonth + 3, 1);

      const rangeLabel = `${m0.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })} – ${m3.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}`;
      const selectedDayBookings = brandRecords.filter(r => r.date === state.crmSelectedDayIso && r.status !== 'Cancelled');

      return `
        <div class="p-4 bg-slate-50/70 space-y-4">
          <!-- 4-Month Window Navigation Bar -->
          <div class="flex flex-wrap items-center justify-between gap-2 bg-white border border-slate-200 rounded-xl px-3.5 py-2.5">
            <div class="flex items-center gap-2">
              <button type="button" onclick="moveCrmFourMonths(-4)" class="w-8 h-8 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-bold text-sm transition" title="Previous 4 Months">
                ‹
              </button>
              <span class="text-xs sm:text-sm font-black text-slate-900 px-1">${rangeLabel}</span>
              <button type="button" onclick="moveCrmFourMonths(4)" class="w-8 h-8 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-bold text-sm transition" title="Next 4 Months">
                ›
              </button>
            </div>

            <div class="flex flex-wrap items-center gap-3 text-[11px] text-slate-600">
              <span class="inline-flex items-center gap-1.5"><i class="w-3 h-3 rounded border border-slate-300 bg-white"></i> Available date</span>
              <span class="inline-flex items-center gap-1.5"><i class="w-3 h-3 rounded border border-amber-300 bg-amber-50"></i> Booked slots</span>
              <span class="inline-flex items-center gap-1.5"><i class="w-3 h-3 rounded bg-slate-200"></i> Past / closed</span>
              <span class="inline-flex items-center gap-1.5"><i class="w-3 h-3 rounded bg-amber-500"></i> Selected</span>
            </div>
          </div>

          <!-- 2x2 Grid of 4 Consecutive Weekday Calendars -->
          <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
            ${buildSingleMonthMacroCard(m0.getFullYear(), m0.getMonth(), brandRecords)}
            ${buildSingleMonthMacroCard(m1.getFullYear(), m1.getMonth(), brandRecords)}
            ${buildSingleMonthMacroCard(m2.getFullYear(), m2.getMonth(), brandRecords)}
            ${buildSingleMonthMacroCard(m3.getFullYear(), m3.getMonth(), brandRecords)}
          </div>

          <!-- Selected Day Agenda & One-Click Drill-Down Bar -->
          <div class="bg-white border border-slate-200 rounded-xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-black text-slate-900">
                  Selected Day: ${formatReadableDate(state.crmSelectedDayIso)}
                </span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                  selectedDayBookings.length > 0 ? 'bg-amber-100 text-amber-900' : 'bg-emerald-100 text-emerald-900'
                }">
                  ${selectedDayBookings.length} booked ${selectedDayBookings.length === 1 ? 'slot' : 'slots'}
                </span>
              </div>
              ${selectedDayBookings.length > 0 ? `
                <div class="mt-2 flex flex-wrap gap-1.5">
                  ${selectedDayBookings.map(b => `
                    <button type="button" onclick="selectMatrixBookedSlot('${b.id}')" class="px-2.5 py-1 rounded-lg bg-[#f6e2c4] hover:bg-amber-200 border border-[#ebd0a6] text-[#92400e] text-[11px] font-bold transition">
                      ${b.time} — ${b.name} (${b.topic})
                    </button>
                  `).join('')}
                </div>
              ` : `
                <p class="text-[11px] text-slate-500 mt-1">
                  All 15-minute weekday slots are open on this date. Use the right panel to book directly or drill down to inspect the time grid.
                </p>
              `}
            </div>

            <button
              type="button"
              onclick="drillDownToDayMatrix('${state.crmSelectedDayIso}')"
              class="px-4 py-2.5 rounded-xl bg-[#15803d] hover:bg-[#166534] text-white text-xs font-extrabold shadow-xs transition whitespace-nowrap shrink-0"
            >
              Drill Down to 15-Min Slots →
            </button>
          </div>
        </div>
      `;
    }

    function renderFifteenMinuteMatrix(brandRecords) {
      const matrixDays = Array.from({ length: 8 }, (_, idx) => addDaysIso(state.crmMatrixStartDate, idx));

      return `
        <div>
          <!-- Drill-Down Breadcrumb Strip -->
          <div class="px-4 py-2 bg-emerald-50/80 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
            <div class="flex items-center gap-2">
              <button type="button" onclick="setCrmViewMode('4month')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 font-extrabold text-[11px] transition">
                ← Back to 4-Month Calendar
              </button>
              <span class="text-slate-600 font-medium">
                Focused around <strong>${formatReadableDate(state.crmSelectedDayIso)}</strong>
              </span>
            </div>
            <div class="flex items-center gap-3 text-[11px] text-slate-600">

                  return `
                    <tr class="${isFocusedRow ? 'bg-amber-50/40' : ''}">
                      <td class="sticky left-0 z-10 ${isFocusedRow ? 'bg-amber-50 text-amber-950' : 'bg-white text-slate-900'} border-r border-slate-300 px-3 py-2 font-extrabold whitespace-nowrap">

                        const bookedRec = brandRecords.find(
                          r => r.date === dayIso && r.time === slot && r.status !== 'Cancelled'
                        );
                        const isSelected =
                          !bookedRec &&
                          state.crmForm.date === dayIso &&
                          state.crmForm.time === slot;

                        if (bookedRec) {
                          return `
                            <td class="p-1 border-r border-slate-200">
                              <button
                                type="button"
                                onclick="selectMatrixBookedSlot('${bookedRec.id}')"

                                Booked

                            </td>
                          `;

                        return `
                          <td class="p-1 border-r border-slate-200">
                            <button
                              type="button"
                              onclick="selectMatrixAvailableSlot('${dayIso}', '${slot}')"
                              title="Select ${formatMatrixDate(dayIso)} at ${slot}"
                              class="${isSelected ? 'matrix-cell-selected' : 'matrix-cell-available'} w-full py-1.5 px-2 rounded text-[11px] font-semibold text-center transition whitespace-nowrap"

                              ${slot}
                            </button>

                        `;
                      }).join('')}

          (r.topic || '').toLowerCase().includes(q) ||
          (r.id || '').toLowerCase().includes(q);

                <tbody class="divide-y divide-slate-200">
                  ${filteredRecords.length > 0 ? filteredRecords.map(rec => `
                    <tr class="hover:bg-slate-50/90 transition">
                      <td class="py-3 px-4 align-top whitespace-nowrap">
                        <span class="font-mono font-bold text-slate-900 block">${rec.id}</span>
                        <span class="inline-block mt-1 px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px] font-semibold">
                          ${rec.source || 'In-Frame Contact Us'}
                        </span>
                      </td>
                      <td class="py-3 px-4 align-top">
                        <div class="font-extrabold text-slate-900">${rec.name}</div>
                        <div class="text-slate-500">${rec.email}</div>
                      </td>
                      <td class="py-3 px-4 align-top whitespace-nowrap">
                        <div class="font-bold text-slate-900">${formatReadableDate(rec.date)}</div>
                        <div class="text-amber-700 font-semibold">${rec.time}</div>
                      </td>
                      <td class="py-3 px-4 align-top max-w-xs">
                        <span class="inline-block px-2 py-0.5 rounded-md bg-s100 text-s900 font-bold text-[11px] mb-1">
                          ${rec.topic}
                        </span>
                        <p class="text-slate-600 line-clamp-2">${rec.message || 'No additional notes provided.'}</p>
                      </td>
                      <td class="py-3 px-4 align-top whitespace-nowrap">
                        <select
                          aria-label="Update status for ${rec.name}"
                          onchange="updateCrmRecordStatus('${rec.id}', this.value)"
                          class="rounded-lg border px-2.5 py-1 text-[11px] font-bold cursor-pointer focus:outline-none ${statusBadgeClasses[rec.status] || statusBadgeClasses.New}"
                        >
                          ${['New', 'Scheduled', 'Confirmed', 'In Progress', 'Completed', 'Cancelled'].map(opt => `
                            <option value="${opt}" ${rec.status === opt ? 'selected' : ''}>${opt}</option>
                          `).join('')}
                        </select>
                      </td>
                      <td class="py-3 px-4 align-top text-right whitespace-nowrap space-x-1.5">
                        <button type="button" onclick="selectMatrixBookedSlot('${rec.id}')" class="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-slate-800 font-bold text-[11px] transition">
                          Load Entry
                        </button>
                        <button type="button" onclick="openContactScriptTemplatesModal('${rec.id}')" class="px-2.5 py-1.5 rounded-lg bg-[#15803d] hover:bg-[#166534] text-white font-bold text-[11px] transition">
                          Scripts &amp; Reply
                        </button>
                      </td>
                    </tr>
                  `).join('') : `
                    <tr>
                      <td colspan="6" class="py-8 text-center text-slate-500">
                        No CRM appointments match the current filter.
                      </td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      `;
    }

    function updateCrmFormField(field, value) {
      state.crmForm[field] = value;
      if (field === 'date') {
        state.crmSelectedDayIso = value;
      }
      renderCurrentTab();
    }

    function clearCrmEntryForm() {
      state.crmForm.editingRecordId = null;
      state.crmForm.selectedCustomerId = '';
      state.crmForm.newCustomerName = '';
      state.crmForm.newCustomerEmail = '';
      state.crmForm.newCustomerPhone = '';
      state.crmForm.notes = '';
      state.crmForm.followUpDate = '';
      state.crmForm.status = 'Scheduled';
      renderCurrentTab();
    }

    function setCrmStatusFilter(status) {
      state.crmFilterStatus = status;
      renderCurrentTab();
    }

    function handleCrmSearchInput(query) {
      state.crmSearchQuery = query;
      renderCurrentTab();
      const input = document.getElementById('crm-search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(query.length, query.length);
      }
    }

    function updateCrmRecordStatus(recordId, newStatus) {
      const records = mfReadClientRequests();
      const idx = records.findIndex(r => r.id === recordId);
      if (idx === -1) return;
      records[idx].status = newStatus;
      mfWriteClientRequests(records);
      syncCrmBadgeCount();
      renderCurrentTab();
      showToast(`Updated ${recordId} status to ${newStatus}.`);
    }

    function saveCrmAppointmentAndActivity(event) {
      event.preventDefault();
      const errBox = document.getElementById('crm-entry-error');
      const dateVal = state.crmForm.date;
      const timeVal = state.crmForm.time;

      if (!dateVal || !timeVal) {
        if (errBox) {
          errBox.textContent = 'Please select an Appointment Date and Time.';
          errBox.classList.remove('hidden');
        }
        return;
      }

      const customers = mfReadCustomers();
      let activeCustomer = null;

      if (state.crmForm.selectedCustomerId === '__NEW__') {
        const newName = state.crmForm.newCustomerName.trim();
        const newEmail = state.crmForm.newCustomerEmail.trim();
        const emailRegex = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
        if (!newName || !emailRegex.test(newEmail)) {
          if (errBox) {
            errBox.textContent = 'Please enter a valid Full Name and Email Address for the new customer.';
            errBox.classList.remove('hidden');
          }
          return;
        }
        activeCustomer = {
          id: 'CUST-' + Math.floor(1000 + Math.random() * 9000),
          presetKey: state.presetKey,
          name: newName,
          company: 'Direct Account',
          email: newEmail,
          phone: state.crmForm.newCustomerPhone.trim() || 'Not provided',
          customerSince: formatIsoDate(new Date()),
          totalOrders: 0,
          lifetimeValue: 0,
          lifecycleStage: 'Active Account'
        };
        customers.unshift(activeCustomer);
        mfWriteCustomers(customers);
        state.crmForm.selectedCustomerId = activeCustomer.id;
      } else {
        activeCustomer = customers.find(c => c.id === state.crmForm.selectedCustomerId);
      }

      if (!activeCustomer) {
        if (errBox) {
          errBox.textContent = 'Please select an existing customer or choose "+ New Customer".';
          errBox.classList.remove('hidden');
        }
        return;
      }

      if (state.crmForm.lifecycleUpdate && state.crmForm.lifecycleUpdate !== 'Keep current status') {
        const custIdx = customers.findIndex(c => c.id === activeCustomer.id);
        if (custIdx !== -1) {
          customers[custIdx].lifecycleStage = state.crmForm.lifecycleUpdate;
          mfWriteCustomers(customers);
        }
      }

      if (errBox) errBox.classList.add('hidden');

      const records = mfReadClientRequests();
      if (state.crmForm.editingRecordId) {
        const idx = records.findIndex(r => r.id === state.crmForm.editingRecordId);
        if (idx !== -1) {
          records[idx] = {
            ...records[idx],
            customerId: activeCustomer.id,
            name: activeCustomer.name,
            email: activeCustomer.email,
            date: dateVal,
            time: timeVal,
            dateTime: `${dateVal} ${timeVal}`,
            topic: state.crmForm.contactType,
            status: state.crmForm.status,
            message: state.crmForm.notes.trim(),
            followUpDate: state.crmForm.followUpDate
          };
        }
        mfWriteClientRequests(records);
        syncCrmBadgeCount();
        state.crmSelectedDayIso = dateVal;
        renderCurrentTab();
        showToast(`Updated appointment ${state.crmForm.editingRecordId}.`);
        return;
      }

      const newRecord = {
        id: 'CRM-' + Math.floor(1000 + Math.random() * 9000),
        customerId: activeCustomer.id,
        business: BUSINESS_PRESETS[state.presetKey].name,
        presetKey: state.presetKey,
        name: activeCustomer.name,
        email: activeCustomer.email,
        date: dateVal,
        time: timeVal,
        dateTime: `${dateVal} ${timeVal}`,
        topic: state.crmForm.contactType,
        message: state.crmForm.notes.trim(),
        followUpDate: state.crmForm.followUpDate,
        status: state.crmForm.status,
        source: 'MF Customer Workspace',
        submittedAt: new Date().toISOString(),
        lastReply: ''
      };

      records.unshift(newRecord);
      mfWriteClientRequests(records);
      syncCrmBadgeCount();
      state.crmSelectedDayIso = dateVal;
      state.crmForm.notes = '';
      renderCurrentTab();
      showToast(`Saved appointment ${newRecord.id} for ${activeCustomer.name}.`);
    }

    /**
     * =========================================================================
     * 8. MODAL HELPERS (SCRIPT TEMPLATES, EXPORT & PRINT)
     * =========================================================================
     */
    function interpolateTemplate(templateText, rec) {
      return templateText
        .replace(/\{\{name\}\}/g, rec.name || 'Valued Customer')
        .replace(/\{\{business\}\}/g, rec.business || BUSINESS_PRESETS[state.presetKey].name)
        .replace(/\{\{topic\}\}/g, rec.topic || 'Consultation')
        .replace(/\{\{date\}\}/g, formatReadableDate(rec.date || '2026-11-30'))
        .replace(/\{\{time\}\}/g, rec.time || '9:00 AM');
    }

    function openContactScriptTemplatesModal(recordId) {
      const modal = document.getElementById('crm-detail-modal');
      const body = document.getElementById('crm-modal-body');
      const titleEl = document.getElementById('modal-client-name');
      const idEl = document.getElementById('modal-record-id');
      const sourceEl = document.getElementById('modal-source-badge');
      if (!modal || !body) return;

      const records = mfReadClientRequests();
      const targetRec = records.find(r => r.id === recordId) || {
        id: 'DRAFT-SCRIPT',
        name: 'Valued Customer',
        business: BUSINESS_PRESETS[state.presetKey].name,
        topic: state.crmForm.contactType || 'Consultation',
        date: state.crmForm.date || '2026-11-30',
        time: state.crmForm.time || '9:00 AM'
      };

      if (idEl) idEl.textContent = targetRec.id;
      if (sourceEl) sourceEl.textContent = 'Communication Script Templates';
      if (titleEl) titleEl.textContent = `Outreach & Follow-Up Scripts — ${targetRec.name}`;

      const initialDraft = interpolateTemplate(CRM_SCRIPT_TEMPLATES[0].body, targetRec);

      body.innerHTML = `
        <div class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            ${CRM_SCRIPT_TEMPLATES.map((tpl, idx) => `
              <button
                type="button"
                onclick="selectScriptTemplateInModal(${idx}, '${targetRec.id}')"
                class="text-left p-3 rounded-xl border border-slate-200 hover:border-emerald-600 hover:bg-emerald-50/50 transition"
              >
                <span class="text-[10px] font-extrabold uppercase text-emerald-800">${tpl.category}</span>
                <div class="text-xs font-extrabold text-slate-900 mt-0.5">${tpl.title}</div>
              </button>
            `).join('')}
          </div>

          <div>
            <label for="crm-reply-textarea" class="block text-xs font-extrabold text-slate-800 mb-1.5">
              Personalized Message Draft (Editable)
            </label>
            <textarea id="crm-reply-textarea" rows="6" class="w-full rounded-xl border border-slate-300 p-3 text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-emerald-600">${initialDraft}</textarea>
          </div>

          <div id="crm-modal-feedback" class="hidden rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-xs font-semibold text-emerald-900"></div>

          <div class="flex flex-wrap items-center justify-end gap-2 pt-2 border-t border-slate-100">
            <button type="button" onclick="copyCrmDraftToClipboard()" class="px-4 py-2 rounded-xl border border-slate-300 hover:bg-slate-100 text-xs font-extrabold text-slate-800 transition">
              Copy to Clipboard
            </button>
            ${targetRec.id !== 'DRAFT-SCRIPT' ? `
              <button type="button" onclick="sendCrmTemplateReply('${targetRec.id}')" class="px-4 py-2 rounded-xl bg-[#15803d] hover:bg-[#166534] text-white text-xs font-extrabold transition">
                Log Reply &amp; Confirm Appointment
              </button>
            ` : ''}
          </div>
        </div>
      `;

      modal.classList.remove('hidden');
    }

    function selectScriptTemplateInModal(tplIdx, recordId) {
      const tpl = CRM_SCRIPT_TEMPLATES[tplIdx];
      const textarea = document.getElementById('crm-reply-textarea');
      if (!tpl || !textarea) return;

      const targetRec = mfReadClientRequests().find(r => r.id === recordId) || {
        name: 'Valued Customer',
        business: BUSINESS_PRESETS[state.presetKey].name,
        topic: state.crmForm.contactType || 'Consultation',
        date: state.crmForm.date || '2026-11-30',
        time: state.crmForm.time || '9:00 AM'
      };
      textarea.value = interpolateTemplate(tpl.body, targetRec);
    }

    function copyCrmDraftToClipboard() {
      const textarea = document.getElementById('crm-reply-textarea');
      const feedback = document.getElementById('crm-modal-feedback');
      if (!textarea) return;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textarea.value).catch(() => {});
      }
      if (feedback) {
        feedback.textContent = '✓ Script draft copied to clipboard.';
        feedback.classList.remove('hidden');
      }
    }

    function sendCrmTemplateReply(recordId) {
      const textarea = document.getElementById('crm-reply-textarea');
      const feedback = document.getElementById('crm-modal-feedback');
      const records = mfReadClientRequests();
      const idx = records.findIndex(r => r.id === recordId);
      if (idx === -1) return;

      records[idx].status = 'Confirmed';
      records[idx].lastReply = textarea ? textarea.value.trim() : 'Confirmed via template.';
      mfWriteClientRequests(records);
      syncCrmBadgeCount();
      renderCurrentTab();

      if (feedback) {
        feedback.textContent = `✓ Reply logged and appointment ${recordId} marked as Confirmed.`;
        feedback.classList.remove('hidden');
      }
    }

    function openPrintPreviewModal() {
      const modal = document.getElementById('crm-detail-modal');
      const body = document.getElementById('crm-modal-body');
      const titleEl = document.getElementById('modal-client-name');
      const idEl = document.getElementById('modal-record-id');
      const sourceEl = document.getElementById('modal-source-badge');
      if (!modal || !body) return;

      const preset = BUSINESS_PRESETS[state.presetKey];
      const records = mfReadClientRequests().filter(r => r.presetKey === state.presetKey);

      if (idEl) idEl.textContent = 'PRINT REPORT';
      if (sourceEl) sourceEl.textContent = preset.name;
      if (titleEl) titleEl.textContent = `${preset.name} — Customer Schedule & Activity Report`;

      body.innerHTML = `
        <div id="printable-report-area" class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-200 pb-3">
            <div>
              <h3 class="text-base font-black text-slate-900">${preset.name} — MF Customer Relations</h3>
              <p class="text-xs text-slate-500">Generated on ${new Date().toLocaleDateString('en-US')} • ${records.length} active records</p>
            </div>
            <button type="button" onclick="window.print()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold transition">
              Print Report
            </button>
          </div>

          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="border-b border-slate-300 text-[11px] font-extrabold uppercase text-slate-600">
                <th class="py-2 pr-2">ID</th>
                <th class="py-2 pr-2">Customer</th>
                <th class="py-2 pr-2">Date &amp; Time</th>
                <th class="py-2 pr-2">Topic</th>
                <th class="py-2">Status</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              ${records.map(r => `
                <tr>
                  <td class="py-2 pr-2 font-mono font-bold">${r.id}</td>
                  <td class="py-2 pr-2 font-bold">${r.name}</td>
                  <td class="py-2 pr-2">${formatReadableDate(r.date)} (${r.time})</td>
                  <td class="py-2 pr-2">${r.topic}</td>
                  <td class="py-2 font-bold">${r.status}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      modal.classList.remove('hidden');
    }

    function exportCrmCsv() {
      const preset = BUSINESS_PRESETS[state.presetKey];
      const records = mfReadClientRequests().filter(r => r.presetKey === state.presetKey);
      const headers = ['ID', 'Business', 'Customer Name', 'Email', 'Date', 'Time', 'Topic', 'Status', 'Notes'];
      const rows = records.map(r => [
        r.id,
        r.business,
        r.name,
        r.email,
        r.date,
        r.time,
        r.topic,
        r.status,
        (r.message || '').replace(/"/g, '""')
      ]);

      const csvContent =
        headers.join(',') +
        '\n' +
        rows.map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${preset.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-crm-schedule.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast(`Exported ${records.length} CRM records to CSV.`);
    }

    function closeCrmModal() {
      const modal = document.getElementById('crm-detail-modal');
      if (modal) modal.classList.add('hidden');
    }

    /**
     * =========================================================================
     * 9. MAIN ROUTER & INITIALIZATION
     * =========================================================================
     */
    function renderCurrentTab() {
      const main = document.getElementById('studio-main');
      if (!main) return;

      if (state.activeTab === 'storefront') {
        main.innerHTML = renderStorefrontPage();
        mfRenderStorefrontCalendar();
        mfSetStorefrontTimes();
      } else if (state.activeTab === 'contact') {
        main.innerHTML = renderContactTabPage();
        mfRenderStorefrontCalendar();
        mfSetStorefrontTimes();
      } else {
        main.innerHTML = renderCustomerRelationsPage();
      }
      syncCrmBadgeCount();
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyPresetTheme(state.presetKey);
      updateNavTabStyles();
      renderCurrentTab();
    });
  </script>
</body>
</html>
